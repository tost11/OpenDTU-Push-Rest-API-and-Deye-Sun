name: Release Builds

on:
  workflow_call:

jobs:
  cpplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cpplint
      - name: Linting
        run: |
          cpplint --repository=. --recursive --filter=-build/c++11,-runtime/references,-readability/braces,-whitespace,-legal,-build/include ./src ./include ./lib/Hoymiles ./lib/MqttSubscribeParser ./lib/TimeoutHelper ./lib/ResetReason

  yarnlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js and yarn
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: "webapp/yarn.lock"
      - name: Install WebApp dependencies
        run: yarn install --frozen-lockfile
        working-directory: webapp
      - name: Linting
        run: yarn lint
        working-directory: webapp

  yarnprettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js and yarn
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "webapp/yarn.lock"
      - name: Install WebApp dependencies
        run: yarn install --frozen-lockfile
        working-directory: webapp
      - name: Check Formatting
        run: yarn prettier --check src/
        working-directory: webapp

  webapp:
    runs-on: ubuntu-latest
    needs: [cpplint, yarnlint, yarnprettier]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js and yarn
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Install WebApp dependencies
        run: |
          cd webapp
          yarn install --frozen-lockfile

      - name: Build all webapp variants
        run: |
          set -e
          variants=$(tail -n +2 scripts/release_matrix.tsv \
              | awk -F'\t' '{print $3"_"$4"_"$5}' | sort -u)
          cd webapp
          for v in $variants; do
            IFS=_ read -r t m d <<<"$v"
            VITE_TOST=$t VITE_MQTT=$m VITE_MDNS=$d yarn build
            cp -r ../webapp_dist "../webapp_dist_$v"
          done

      - name: Upload webapp artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webapp-dist
          path: webapp_dist_*/

  canary:
    runs-on: ubuntu-latest
    needs: webapp
    outputs:
      rest: ${{ steps.rest.outputs.rest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify canary row (first matrix row)
        id: row
        run: |
          line=$(tail -n +2 scripts/release_matrix.tsv | head -n 1)
          {
            echo "name=$(cut -f1 <<<"$line")"
            echo "wa=$(awk -F'\t' '{print $3"_"$4"_"$5}' <<<"$line")"
          } >> "$GITHUB_OUTPUT"

      - name: Compute matrix for the remaining rows
        id: rest
        run: |
          rest=$(tail -n +3 scripts/release_matrix.tsv | cut -f1 | jq -R . | jq -s .)
          {
            echo "rest<<RESTEOF"
            echo "$rest"
            echo "RESTEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-opendtu
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools intelhex

      - name: Download webapp artifacts
        uses: actions/download-artifact@v8
        with:
          name: webapp-dist
          path: wa

      - name: Build canary firmware
        env:
          RELEASE_WEBAPP_DIR: wa/webapp_dist_${{ steps.row.outputs.wa }}
          RELEASE_NAME_PREFIX: ${{ startsWith(github.ref, 'refs/tags/') && format('opendtu-{0}-', github.ref_name) || '' }}
        run: bash scripts/release_builds.sh "${{ steps.row.outputs.name }}"

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fw-${{ steps.row.outputs.name }}
          path: release/

  firmware:
    runs-on: ubuntu-latest
    needs: [webapp, canary]
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.canary.outputs.rest) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-opendtu
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio setuptools intelhex

      - name: Download webapp artifacts
        uses: actions/download-artifact@v8
        with:
          name: webapp-dist
          path: wa

      - name: Identify webapp variant
        id: row
        run: |
          line=$(grep -P "^\Q${{ matrix.firmware }}\E\t" scripts/release_matrix.tsv)
          echo "wa=$(awk -F'\t' '{print $3"_"$4"_"$5}' <<<"$line")" >> "$GITHUB_OUTPUT"

      - name: Build firmware ${{ matrix.firmware }}
        env:
          RELEASE_WEBAPP_DIR: wa/webapp_dist_${{ steps.row.outputs.wa }}
          RELEASE_NAME_PREFIX: ${{ startsWith(github.ref, 'refs/tags/') && format('opendtu-{0}-', github.ref_name) || '' }}
        run: bash scripts/release_builds.sh "${{ matrix.firmware }}"

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.firmware }}
          path: release/
